<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="560" viewBox="0 0 1900 560" role="img" aria-labelledby="title desc"><title id="title">Proxmox timeline, 2005–2025</title><desc id="desc">Redrawn from supplied training material. Proxmox Datacenter Manager 1.0 released in December 2025.</desc><rect width="1900" height="560" fill="#faf7f0"/><path d="M85 270H1810l-20-20m20 20-20 20" fill="none" stroke="#b8afa4" stroke-width="12" stroke-linejoin="round"/><g font-family="Segoe UI,Arial,sans-serif"><path d="M92 225V70" stroke="#b8afa4" stroke-width="2"/><rect x="46" y="224" width="92" height="92" rx="28" fill="#e96e00"/><text x="92" y="280" text-anchor="middle" fill="white" font-size="27" font-weight="700">2005</text><text x="22" y="95" fill="#e96e00" font-size="21" font-weight="700">Company founded</text><text x="22" y="126" fill="#e96e00" font-size="21" font-weight="700">Martin &amp; Dietmar Maurer</text><text x="22" y="157" fill="#3f3934" font-size="21" font-weight="400">Proxmox Mail Gateway</text><path d="M275 315V465" stroke="#b8afa4" stroke-width="2"/><rect x="229" y="224" width="92" height="92" rx="28" fill="#e96e00"/><text x="275" y="280" text-anchor="middle" fill="white" font-size="27" font-weight="700">2008</text><text x="205" y="365" fill="#e96e00" font-size="21" font-weight="700">Proxmox Virtual</text><text x="205" y="396" fill="#e96e00" font-size="21" font-weight="700">Environment</text><path d="M458 225V70" stroke="#b8afa4" stroke-width="2"/><rect x="412" y="224" width="92" height="92" rx="28" fill="#00637d"/><text x="458" y="280" text-anchor="middle" fill="white" font-size="27" font-weight="700">2013</text><text x="388" y="95" fill="#3f3934" font-size="21" font-weight="400">Enterprise repository</text><text x="388" y="126" fill="#3f3934" font-size="21" font-weight="400">Ceph support</text><path d="M641 315V465" stroke="#b8afa4" stroke-width="2"/><rect x="595" y="224" width="92" height="92" rx="28" fill="#00637d"/><text x="641" y="280" text-anchor=